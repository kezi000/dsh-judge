# dsh-judge 作为 profile 组合包（bundle）时的挂载行。
# 组合包 patch 的格式必须是 patch 操作列表：`- insert: [ { id, name, config } ]`
# （与 dsh-infinite-gen-4 的 cordis.patch.yml 写法一致）。
# 若只想用 home patch 手动挂载，把下面的 insert 段整段抄进
# %USERPROFILE%\.dsh\cordis.patch.yml 即可。
- insert:
    - id: dsh-judge
      name: dsh-judge
      config:
        enabled: true
        # 首次部署建议 true：只记录“本应驳回”的判定，不真正打断回答。
        dryRun: false
        # 成本控制：最多打断一次；整个会话最多驳回 4 次；寒暄/短答不调审判。
        maxAttempts: 1
        sessionRejectBudget: 4
        skipTrivial: true
        minAnswerChars: 40
        onJudgeError: allow
        skipSubagents: true
        language: zh
        # 留空 = 跟随当前会话的 provider/model；也可以指定更便宜/更强的审判模型。
        judgeProvider: ''
        judgeModel: ''
        judgeMaxTokens: 3000
        transcriptChars: 8000
        toolResultChars: 1200
        submitTool: true
        promptOrder: 900
        contract: ''
        # Jev（TypeSafe System One）廉价预筛：默认关闭。
        # 打开后先用 Noul 概率判断"有无缺证据/矛盾的断言"，低风险直接放行、不调大模型审判。
        # 本机直连 api.typesafe.ai 会返回 451（区域限制），需要走本地代理。
        jev:
          enabled: false
          baseUrl: https://api.typesafe.ai
          model: jev-latest
          proxyUrl: http://127.0.0.1:10809
          apiKeyEnv: TYPESAFE_API_KEY
          apiKeyFile: C:/Users/XY/.typesafe/api-key.txt
          stateChars: 4000
          riskThreshold: 0.5
          timeoutMs: 12000
          onError: judge
